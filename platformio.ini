; ============================================================
; ESP32 + DWM3000 UWB Spatial Synth PlatformIO Config
; Anchors: IDs 1–6
; Tags: file 1 = ID 7, file 2 = ID 8, file 3 = ID 9, file 4 = ID 10
; ============================================================

[platformio]
default_envs = anchor_listener

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Optional but helpful for ESP32 stability
upload_speed = 921600

; ============================================================
; ANCHORS
; ============================================================

; Anchor 1: listener anchor plugged into computer over USB
[env:anchor_listener]
build_src_filter =
    -<*>
    +<Anchor/main_anchor1_listener.cpp>
build_flags =
    -DANCHOR_ID=1

; Anchor 2
[env:anchor2]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_2.cpp>
build_flags =
    -DANCHOR_ID=2

; Anchor 3
[env:anchor3]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_3.cpp>
build_flags =
    -DANCHOR_ID=3

; Anchor 4
[env:anchor4]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_4.cpp>
build_flags =
    -DANCHOR_ID=4

; Anchor 5
[env:anchor5]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_5.cpp>
build_flags =
    -DANCHOR_ID=5

; Anchor 6
[env:anchor6]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_6.cpp>
build_flags =
    -DANCHOR_ID=6


; ============================================================
; TAGS
; ============================================================

[env:tag1]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_1.cpp>
build_flags =
    -DTAG_ID=7

[env:tag2]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_2.cpp>
build_flags =
    -DTAG_ID=8

[env:tag3]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_3.cpp>
build_flags =
    -DTAG_ID=9

[env:tag4]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_4.cpp>
build_flags =
    -DTAG_ID=10