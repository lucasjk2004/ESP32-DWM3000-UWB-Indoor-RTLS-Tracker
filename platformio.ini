; ============================================================
; ESP32 + DWM3000 UWB Spatial Synth PlatformIO Config
; ============================================================

[platformio]
default_envs = anchor1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

; ============================================================
; ANCHORS — all use the same file, ANCHOR_ID set per env
; Anchor 1 is the listener wired to the PC.
; ============================================================

[env:anchor1]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=1

[env:anchor2]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=2

[env:anchor3]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=3

[env:anchor4]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=4

[env:anchor5]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=5

[env:anchor6]
build_src_filter = -<*> +<Anchor/main_anchor.cpp>
build_flags = ${env.build_flags} -DANCHOR_ID=6

; ============================================================
; TAGS — all use the same file, TAG_ID set per env
; Tag IDs are 7..10 (must match FIRST_TAG_ID in uwb_protocol.py).
; ============================================================

[env:tag7]
build_src_filter = -<*> +<Tag/main_tag.cpp>
build_flags = ${env.build_flags} -DTAG_ID=7

[env:tag8]
build_src_filter = -<*> +<Tag/main_tag.cpp>
build_flags = ${env.build_flags} -DTAG_ID=8

[env:tag9]
build_src_filter = -<*> +<Tag/main_tag.cpp>
build_flags = ${env.build_flags} -DTAG_ID=9

[env:tag10]
build_src_filter = -<*> +<Tag/main_tag.cpp>
build_flags = ${env.build_flags} -DTAG_ID=10