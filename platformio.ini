; ============================================================
; ESP32 + DWM3000 UWB Spatial Synth PlatformIO Config
;
; Two independent ranging sets running on different UWB channels:
;
;   Set 1 (channel 5)
;     - anchor_listener  (ID 1, USB-connected, emits CSV)
;     - anchor2, anchor3, anchor4
;     - tag5             (ID 5)
;
;   Set 2 (channel 9)
;     - anchor6_listener (ID 6, USB-connected, emits CSV)
;     - anchor7, anchor8, anchor9
;     - tag10            (ID 10)
;
; Each set is one listener + 3 dumb anchors + 1 tag. The two
; sets share IDs in no way and operate on disjoint channels, so
; they can run concurrently without interference.
; ============================================================

[platformio]
default_envs = anchor_listener

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600


; ============================================================
; SET 1 - CHANNEL 5  (anchors 1-4, tag 5)
; ============================================================

; Anchor 1: listener for set 1, USB-connected, emits CSV
[env:anchor_listener]
build_src_filter =
    -<*>
    +<Anchor/main_anchor1_listener.cpp>
build_flags =
    -DANCHOR_ID=1

; Anchor 2 (dumb, set 1)
[env:anchor2]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_2.cpp>
build_flags =
    -DANCHOR_ID=2

; Anchor 3 (dumb, set 1)
[env:anchor3]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_3.cpp>
build_flags =
    -DANCHOR_ID=3

; Anchor 4 (dumb, set 1)
[env:anchor4]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_4.cpp>
build_flags =
    -DANCHOR_ID=4

; Tag 5 (set 1)
[env:tag5]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_5.cpp>
build_flags =
    -DTAG_ID=5


; ============================================================
; SET 2 - CHANNEL 9  (anchors 6-9, tag 10)
; ============================================================

; Anchor 6: listener for set 2, USB-connected, emits CSV
[env:anchor6_listener]
build_src_filter =
    -<*>
    +<Anchor/main_anchor6_listener.cpp>
build_flags =
    -DANCHOR_ID=6

; Anchor 7 (dumb, set 2)
[env:anchor7]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_7.cpp>
build_flags =
    -DANCHOR_ID=7

; Anchor 8 (dumb, set 2)
[env:anchor8]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_8.cpp>
build_flags =
    -DANCHOR_ID=8

; Anchor 9 (dumb, set 2)
[env:anchor9]
build_src_filter =
    -<*>
    +<Anchor/main_anchor_9.cpp>
build_flags =
    -DANCHOR_ID=9

; Tag 10 (set 2)
[env:tag10]
build_src_filter =
    -<*>
    +<Tag/main_tag_broadcast_10.cpp>
build_flags =
    -DTAG_ID=10